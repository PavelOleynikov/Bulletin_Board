[tool.poetry]
name = "bulletin-board"
version = "0.1.0"
description = "Bulletin Board API with Django REST Framework"
authors = ["Pavel Oleynikov <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.13.5"
django = ">=5.2,<6.0"
psycopg2-binary = ">=2.9,<3.0"
pillow = ">=10.4,<13.0"
python-dotenv = ">=1.2.1,<2.0.0"
djangorestframework = ">=3.16.1,<4.0.0"
django-filter = ">=24.3,<26.0"
djangorestframework-simplejwt = ">=5.5.1,<6.0.0"
drf-yasg = ">=1.21.14,<2.0.0"
django-cors-headers = ">=4.9.0,<5.0.0"

[tool.poetry.group.dev.dependencies]
ipython = ">=9.9.0,<10.0.0"
coverage = ">=7.6,<8.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^26.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.flake8]
max-line-length = 140
extend-ignore = ["E203", "W503"]
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "migrations",
    ".tox",
    ".eggs",
    "*.egg-info",
    "build",
    "dist",
    "docs"
]
